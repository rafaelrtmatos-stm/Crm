<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D0D0F" />
    <meta name="description" content="Sistema de gestão comercial e operacional para Rafa Arts Graphics, integrando CRM, Meta Ads, PDV, Vendas, Serviços e Automações." />
    <meta property="og:title" content="Rafa Arts Graphics" />
    <meta property="og:description" content="Sistema de gestão comercial e operacional para Rafa Arts Graphics, integrando CRM, Meta Ads, PDV, Vendas, Serviços e Automações." />
    <!-- Fontes: carregadas SEM bloquear a abertura do app. Com Wi-Fi sem internet, o @import antigo no CSS
         segurava a primeira tela ate o Google Fonts dar timeout; assim o app abre na hora com fonte do sistema
         e troca pela fonte certa quando (e se) ela chegar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Playfair+Display:wght@700;900&amp;family=Dancing+Script:wght@600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Playfair+Display:wght@700;900&amp;family=Dancing+Script:wght@600;700&amp;display=swap" /></noscript>
    <title>Rafa Arts Graphics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
