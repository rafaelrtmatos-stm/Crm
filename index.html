<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D0D0F" />
    <meta name="description" content="Sistema de gestão comercial e operacional para Rafa Arts Graphics, integrando CRM, Meta Ads, PDV, Vendas, Serviços e Automações." />
    <meta property="og:title" content="Rafa Arts Graphics" />
    <meta property="og:description" content="Sistema de gestão comercial e operacional para Rafa Arts Graphics, integrando CRM, Meta Ads, PDV, Vendas, Serviços e Automações." />
    <!-- Fontes: carregadas SEM bloquear a abertura do app. Com Wi-Fi sem internet, o @import antigo no CSS
         segurava a primeira tela ate o Google Fonts dar timeout; assim o app abre na hora com fonte do sistema
         e troca pela fonte certa quando (e se) ela chegar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Playfair+Display:wght@700;900&amp;family=Dancing+Script:wght@600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Playfair+Display:wght@700;900&amp;family=Dancing+Script:wght@600;700&amp;display=swap" /></noscript>
    <title>Rafa Arts Graphics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 1. Tratamento automático de erro de carregamento de módulos (Vite chunk mismatch ou reinicialização do dev server)
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        window.location.reload();
      });
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (
          msg.includes('Importing a module script failed') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('error loading dynamically imported module')
        ) {
          var key = 'module_err_reload';
          var hasReloaded = sessionStorage.getItem(key);
          if (!hasReloaded) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('load', function() {
        sessionStorage.removeItem('module_err_reload');
      });

      // 2. Service Worker: apenas em produção real com domínio próprio (nunca em ambientes dev/preview de cloud)
      if ('serviceWorker' in navigator) {
        var host = window.location.hostname;
        var isDevOrCloudRun = host.includes('ais-dev-') ||
                              host.includes('ais-pre-') ||
                              host.includes('.run.app') ||
                              host.includes('localhost') ||
                              host.includes('127.0.0.1') ||
                              window.location.port === '3000';
        if (isDevOrCloudRun) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.error('SW registration failed:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
